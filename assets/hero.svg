<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">sushi-stack</title>
  <desc id="desc">A little tower of nigiri on a cream counter, with chopsticks and sparkles.</desc>
  <defs>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7f0"/>
      <stop offset="100%" stop-color="#f3e4d6"/>
    </linearGradient>
    <linearGradient id="salmon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb39a"/>
      <stop offset="100%" stop-color="#f07858"/>
    </linearGradient>
    <linearGradient id="tuna" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f08a8a"/>
      <stop offset="100%" stop-color="#d45b63"/>
    </linearGradient>
    <linearGradient id="avocado" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8e38a"/>
      <stop offset="100%" stop-color="#8fbf4a"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#c9a992" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="960" height="360" rx="28" fill="url(#counter)"/>
  <circle cx="120" cy="70" r="42" fill="#ffe8d6" opacity="0.9"/>
  <circle cx="860" cy="280" r="64" fill="#ead9c8" opacity="0.55"/>
  <circle cx="800" cy="64" r="18" fill="#ffd6c4"/>
  <path d="M70 48 l6 14 15 2 -12 10 3 15 -13 -8 -13 8 3-15 -12-10 15-2 z" fill="#ffb7c5" opacity="0.85"/>
  <path d="M890 92 l4 10 11 1 -9 7 2 10 -9 -6 -9 6 2-10 -8-7 11-1 z" fill="#9fd8c5"/>

  <!-- chopsticks -->
  <g transform="translate(628 86) rotate(18)">
    <rect x="0" y="0" width="210" height="10" rx="5" fill="#6b3f2a"/>
    <rect x="168" y="0" width="42" height="10" rx="5" fill="#e8c9a8"/>
    <rect x="8" y="18" width="210" height="10" rx="5" fill="#5a3422"/>
    <rect x="176" y="18" width="42" height="10" rx="5" fill="#e8c9a8"/>
  </g>

  <!-- bottom nigiri -->
  <g filter="url(#soft)" transform="translate(330 214)">
    <ellipse cx="150" cy="46" rx="168" ry="28" fill="#e2cbb8"/>
    <ellipse cx="150" cy="28" rx="150" ry="36" fill="#fffaf4"/>
    <ellipse cx="150" cy="22" rx="138" ry="28" fill="#fff"/>
    <rect x="18" y="-8" width="264" height="38" rx="18" fill="url(#avocado)"/>
    <path d="M40 4c40-16 80-18 122-8 36 8 70 8 108-2" fill="none" stroke="#f7ffe8" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- middle nigiri -->
  <g filter="url(#soft)" transform="translate(348 150)">
    <ellipse cx="132" cy="44" rx="150" ry="26" fill="#e2cbb8" opacity="0.7"/>
    <ellipse cx="132" cy="26" rx="134" ry="34" fill="#fffaf4"/>
    <ellipse cx="132" cy="20" rx="124" ry="26" fill="#fff"/>
    <rect x="16" y="-10" width="232" height="36" rx="18" fill="url(#tuna)"/>
    <path d="M36 2c28-10 70-16 110-6 32 8 62 6 96-4" fill="none" stroke="#ffd4d4" stroke-width="4" stroke-linecap="round" opacity="0.65"/>
  </g>

  <!-- top nigiri -->
  <g filter="url(#soft)" transform="translate(368 86)">
    <ellipse cx="114" cy="42" rx="132" ry="24" fill="#e2cbb8" opacity="0.65"/>
    <ellipse cx="114" cy="24" rx="118" ry="32" fill="#fffaf4"/>
    <ellipse cx="114" cy="18" rx="108" ry="24" fill="#fff"/>
    <rect x="14" y="-12" width="200" height="34" rx="17" fill="url(#salmon)"/>
    <path d="M32 0c24-10 58-14 92-4 28 8 54 6 84-4" fill="none" stroke="#ffe1d4" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- wasabi + ginger -->
  <ellipse cx="214" cy="268" rx="28" ry="16" fill="#b7e36a"/>
  <ellipse cx="214" cy="262" rx="22" ry="11" fill="#d4f08a"/>
  <path d="M742 250 c12-18 28-18 36-4 8 12-2 24-18 28 -18 4-28-8-18-24z" fill="#ffb7c5"/>
  <path d="M770 258 c10-14 24-12 28 0 6 12-4 20-16 22 -14 2-22-8-12-22z" fill="#ffc9d4"/>

  <text x="48" y="318" font-family="ui-rounded, 'Trebuchet MS', sans-serif" font-size="22" fill="#8a5a44">omakase for agents</text>
</svg>
